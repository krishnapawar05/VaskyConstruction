<!DOCTYPE html>
<html>

<head>
    <link rel="icon" type="image/x-icon" href="images/logo.png">
    <title>VASKY Construction | Registration</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
            min-height: 100vh;
            background: #f0f0f0;
            background-image: url('images/login.png');
            background-repeat: no-repeat;
            background-size: cover;
            flex-direction: column;
            margin: 0;
        }

        .main {
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 20px rgba(0, 0, 0, 0.2);
            padding: 0px 20px;
            transition: transform 0.2s;
            width: 500px;
            text-align: center;
        }

        h1 {
            color: rgb(62, 63, 68);
        }

        label {
            display: block;
            width: 100%;
            margin-top: 10px;
            margin-bottom: 5px;
            text-align: left;
            color: #555;
            font-weight: bold;
        }


        input {
            display: block;
            width: 100%;
            margin-bottom: 15px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            border: none;
            color: white;
            cursor: pointer;
            background-color: #0c7092;
            width: 100%;
            font-size: 16px;
        }

        .wrap {
            display: flex;
            justify-content: center;
            align-items: center;
        }

    
        
    </style>
</head>

<body>
    <div class="main">
        <h1>Create Account</h1>
        <p>Already have an account?
            <a href="login.html" style="text-decoration: none;">
                Login
            </a>
        </p>
        <form action="signup.jsp" method="post">
            <label for="Username">
                Username:
            </label>
            <input type="text" name="t1" placeholder="Username" required>

            <label for="Email">
                Email:
            </label>
            <input type="text" name="t2" placeholder="Email" required>

            <label for="Password">
                Password:
            </label>
            <input type="password" name="t3" placeholder="Password" required>


            <label for="Confirm password">Confirm password:</label>
            <input type="password" name="t4" placeholder="Confirm password" required>

           
                <div class="wrap">
                    <button type="submit">Submit</button>
                </div>
            
        </form>
    </div>



</body>

</html>
